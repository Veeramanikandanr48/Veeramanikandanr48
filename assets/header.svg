<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Veeramanikandan R, Product Engineer and Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050A"/>
      <stop offset="0.45" stop-color="#0B0B18"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.22" stop-color="#5B8CFF"/>
      <stop offset="0.45" stop-color="#B44CFF"/>
      <stop offset="0.68" stop-color="#FF3D9A"/>
      <stop offset="0.86" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF3D9A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="220" fill="url(#orbCyan)"/>
  <circle cx="1080" cy="300" r="260" fill="url(#orbPink)"/>
  <circle cx="980" cy="20" r="180" fill="url(#orbPurple)"/>
  <g opacity="0.55" stroke="#00E5FF" fill="none">
    <circle cx="1020" cy="160" r="92" stroke-dasharray="6 14" stroke-width="1.5" class="ring"/>
    <circle cx="1020" cy="160" r="118" stroke-dasharray="2 18" stroke-width="1" class="ring ring-rev"/>
  </g>
  <g opacity="0.5">
    <circle cx="80" cy="230" r="2.5" fill="#00E5FF" class="particle p1"/>
    <circle cx="180" cy="90" r="2" fill="#FF3D9A" class="particle p2"/>
    <circle cx="300" cy="260" r="2" fill="#FFD166" class="particle p3"/>
    <circle cx="450" cy="50" r="1.8" fill="#00E5FF" class="particle p4"/>
    <circle cx="720" cy="270" r="2.2" fill="#B44CFF" class="particle p5"/>
    <circle cx="880" cy="70" r="2" fill="#FF3D9A" class="particle p6"/>
    <circle cx="1120" cy="220" r="2.4" fill="#00E5FF" class="particle p7"/>
    <circle cx="1160" cy="90" r="1.8" fill="#FFD166" class="particle p8"/>
  </g>
  <g class="scan">
    <rect x="0" y="0" width="1200" height="2" fill="url(#cyanline)" opacity="0.8"/>
  </g>
  <g filter="url(#glow)">
    <text x="600" y="154" text-anchor="middle" class="name" fill="url(#rainbow)" stroke="#05050A" stroke-width="2" paint-order="stroke">VEERAMANIKANDAN R</text>
  </g>
  <text x="600" y="202" text-anchor="middle" class="sub">PRODUCT ENGINEER · FULL STACK DEVELOPER</text>
  <text x="600" y="236" text-anchor="middle" class="tagline">BUILDING PRODUCTS THAT SHIP</text>
  <g transform="translate(600 278)" text-anchor="middle">
    <rect x="-260" y="-16" width="150" height="32" rx="16" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-opacity="0.35"/>
    <text x="-185" y="6" class="chip">TYPESCRIPT</text>
    <rect x="-95" y="-16" width="150" height="32" rx="16" fill="#FF3D9A" fill-opacity="0.08" stroke="#FF3D9A" stroke-opacity="0.35"/>
    <text x="-20" y="6" class="chip">FULL STACK</text>
    <rect x="70" y="-16" width="150" height="32" rx="16" fill="#FFD166" fill-opacity="0.08" stroke="#FFD166" stroke-opacity="0.35"/>
    <text x="145" y="6" class="chip">AI / AUTOMATION</text>
  </g>
  <style>
    .name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 70px; font-weight: 800; letter-spacing: 3px; animation: hue 9s linear infinite; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 5px; fill: #E6E6E6; }
    .tagline { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 4px; fill: #8A8A9A; }
    .chip { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #FFFFFF; fill-opacity: 0.85; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    .ring-rev { animation: spin-rev 22s linear infinite; }
    .particle { animation: float 6s ease-in-out infinite; }
    .p1 { animation-delay: -1s; }
    .p2 { animation-delay: -2s; }
    .p3 { animation-delay: -3s; }
    .p4 { animation-delay: -4s; }
    .p5 { animation-delay: -5s; }
    .p6 { animation-delay: -1.5s; }
    .p7 { animation-delay: -2.5s; }
    .p8 { animation-delay: -3.5s; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.35; } 50% { transform: translateY(-12px); opacity: 0.9; } }
    @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(340px); } }
    @media (prefers-reduced-motion: reduce) { .name, .ring, .ring-rev, .particle, .scan { animation: none; } }
  </style>
</svg>
