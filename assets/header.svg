<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-label="Hello, I'm Veeramanikandan R, Product Engineer and Full Stack Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.3" stop-color="#7C4DFF"/>
      <stop offset="0.55" stop-color="#FF3D9A"/>
      <stop offset="0.8" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF3D9A"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#FF3D9A" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#05050A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="#05050A"/>
  <ellipse cx="800" cy="168" rx="500" ry="110" fill="url(#halo)"/>
  <text x="800" y="94" text-anchor="middle" class="hello">HELLO, I'M</text>
  <g filter="url(#glow)">
    <text x="800" y="182" text-anchor="middle" class="name glitch glitch-cyan">VEERAMANIKANDAN R</text>
    <text x="800" y="182" text-anchor="middle" class="name glitch glitch-pink">VEERAMANIKANDAN R</text>
    <text x="800" y="182" text-anchor="middle" class="name" fill="url(#nameGrad)" stroke="#05050A" stroke-width="2" paint-order="stroke">VEERAMANIKANDAN R</text>
  </g>
  <rect x="590" y="208" width="420" height="2" rx="1" fill="url(#lineGrad)" class="line"/>
  <text x="800" y="244" text-anchor="middle" class="sub">PRODUCT ENGINEER · FULL STACK DEVELOPER</text>
  <text x="800" y="274" text-anchor="middle" class="tagline">I BUILD PRODUCTS THAT SHIP</text>
  <style>
    .hello { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 8px; fill: #9A9AAA; }
    .name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 78px; font-weight: 800; letter-spacing: 3px; animation: hue 9s linear infinite; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 5px; fill: #E6E6E6; }
    .tagline { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 4px; fill: #7A7A8A; }
    .glitch { opacity: 0; }
    .glitch-cyan { fill: #00E5FF; animation: glitch-cyan 4s infinite; }
    .glitch-pink { fill: #FF3D9A; animation: glitch-pink 4.3s infinite; }
    .line { transform-box: fill-box; transform-origin: center; animation: line 4s ease-in-out infinite; }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
    @keyframes glitch-cyan {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
      89% { transform: translate(-5px, 1px); opacity: 0.8; }
      91% { transform: translate(4px, -1px); opacity: 0.55; }
      93% { transform: translate(-3px, 0); opacity: 0.7; }
      95% { transform: translate(2px, 1px); opacity: 0.45; }
    }
    @keyframes glitch-pink {
      0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(5px, -1px); opacity: 0.75; }
      93% { transform: translate(-4px, 1px); opacity: 0.5; }
      95% { transform: translate(3px, 0); opacity: 0.65; }
      97% { transform: translate(-2px, -1px); opacity: 0.4; }
    }
    @keyframes line {
      0%, 100% { transform: scaleX(0.35); opacity: 0.35; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .name, .glitch-cyan, .glitch-pink, .line { animation: none; }
      .glitch { display: none; }
    }
  </style>
</svg>
